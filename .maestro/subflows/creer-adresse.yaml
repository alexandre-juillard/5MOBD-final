appId: host.exp.exponent
---
- tapOn:
    id: "onglet-mes-adresses"
- tapOn:
    id: "bouton-nouvelle-adresse"
- extendedWaitUntil:
    visible:
      id: "champ-nom-adresse"
    timeout: 10000
- tapOn:
    id: "champ-nom-adresse"
- inputText: ${NOM_ADRESSE}
- tapOn:
    id: "champ-description"
- inputText: "Adresse créée par Maestro"
- tapOn: "Visibilité"
- runFlow:
    when:
      true: ${PUBLIQUE == 'true'}
    commands:
      - tapOn:
          id: "option-publique"
- tapOn:
    id: "bouton-ma-position"
- extendedWaitUntil:
    visible:
      id: "emplacement-choisi"
    timeout: 30000
- tapOn:
    id: "bouton-enregistrer-adresse"
- extendedWaitUntil:
    visible: ${NOM_ADRESSE}
    timeout: 30000
